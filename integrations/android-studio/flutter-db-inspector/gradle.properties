# Plugin
pluginGroup = com.manishdevan.flutterdb
pluginVersion = 1.0.0
pluginSinceBuild = 251

# Platform to build against. When `platformLocalPath` exists (a local Android
# Studio or IntelliJ installation) it is used, which avoids a ~1 GB download.
# Otherwise IntelliJ IDEA Community `platformVersion` is downloaded (CI).
platformLocalPath = /Applications/Android Studio.app
platformVersion = 2025.1.3

# The IntelliJ Platform bundles the Kotlin standard library and coroutines.
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching = true
