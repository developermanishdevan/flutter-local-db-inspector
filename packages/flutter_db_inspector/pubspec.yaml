name: flutter_db_inspector
description: >-
  Inspect, query and edit your Flutter app's local databases from DevTools,
  VS Code and Android Studio while it runs. Runtime, wire protocol and the
  DevTools extension in one package; add a connector per database you use.
version: 2.0.0
homepage: https://github.com/developermanishdevan/flutter-local-db-inspector
repository: https://github.com/developermanishdevan/flutter-local-db-inspector/tree/main/packages/flutter_db_inspector
issue_tracker: https://github.com/developermanishdevan/flutter-local-db-inspector/issues
topics:
  - database
  - sqlite
  - devtools
  - debugging
  - inspector

screenshots:
  - description: Flutter DB Inspector logo
    path: doc/logo.jpg

environment:
  sdk: ^3.6.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  vm_service: ^15.0.0
