name: flutter_db_inspector_secure_storage
description: >-
  flutter_secure_storage adapter for Flutter DB Inspector. Lists secure storage
  keys with values masked by default.
version: 1.0.0
homepage: https://github.com/developermanishdevan/flutter-local-db-inspector
repository: https://github.com/developermanishdevan/flutter-local-db-inspector/tree/main/packages/flutter_db_inspector_secure_storage
issue_tracker: https://github.com/developermanishdevan/flutter-local-db-inspector/issues
topics:
  - secure-storage
  - storage
  - key-value
  - inspector

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_db_inspector_core: ^1.0.0
  flutter_secure_storage: ">=9.2.0 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

