name: flutter_db_inspector_realm
description: >-
  Realm adapter for Flutter DB Inspector. Browse, filter, sort and edit Realm
  objects through Realm's dynamic API, without per-class code.
version: 1.0.0
homepage: https://github.com/developermanishdevan/flutter-local-db-inspector
repository: https://github.com/developermanishdevan/flutter-local-db-inspector/tree/main/packages/flutter_db_inspector_realm
issue_tracker: https://github.com/developermanishdevan/flutter-local-db-inspector/issues
topics:
  - realm
  - database
  - nosql
  - inspector

environment:
  sdk: ^3.6.0

dependencies:
  flutter_db_inspector_core: ^1.0.0
  realm_dart: ^20.2.0

dev_dependencies:
  build_runner: ^2.4.15
  lints: ^6.0.0
  test: ^1.25.0

