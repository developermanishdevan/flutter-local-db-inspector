  - nosql
  - inspector

environment:
  sdk: ^3.6.0

dependencies:
  flutter_db_inspector_core: ^1.0.0
  sembast: ^3.8.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

