name: Release Android Studio plugin

# Push a tag like `android-studio-v1.0.1` (it must match gradle.properties
# "pluginVersion"), or run manually from the Actions tab.
#
# JetBrains Marketplace only accepts updates through the API: upload the very
# first version by hand at https://plugins.jetbrains.com/plugin/add.
#
# Repository secrets:
#   PUBLISH_TOKEN         JetBrains Marketplace token (plugins.jetbrains.com > profile > My Tokens).
#   CERTIFICATE_CHAIN     Optional plugin signing certificate (PEM), with
#   PRIVATE_KEY           its private key (PEM) and
#   PRIVATE_KEY_PASSWORD  the key's password. Without them the zip is published unsigned
#                         (Marketplace still signs it).
on:
  push:
    tags: ['android-studio-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to JetBrains Marketplace (otherwise only build the zip)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-android-studio
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/android-studio/flutter-db-inspector
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The plugin bundles the shared web UI (built by Gradle's buildWebUi task).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shared/web-ui/package-lock.json

      - name: Check tag matches pluginVersion
        if: github.event_name == 'push'
        run: |
          VERSION=$(grep '^pluginVersion' gradle.properties | cut -d= -f2 | tr -d ' ')
          if [ "${GITHUB_REF_NAME}" != "android-studio-v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pluginVersion ${VERSION} (expected android-studio-v${VERSION})"
            exit 1
          fi

      # No local IDE on the runner, so this builds against IntelliJ IDEA Community
      # `platformVersion` (the since-build platform). Tests run in ci.yml, and
      # Marketplace runs the Plugin Verifier on every upload.
      - name: Build and verify
        run: ./gradlew --no-daemon buildPlugin verifyPluginProjectConfiguration
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-db-inspector-intellij-plugin
          path: integrations/android-studio/flutter-db-inspector/build/distributions/*.zip

      - name: Publish to JetBrains Marketplace
        if: env.PUBLISH == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon publishPlugin

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(ls build/distributions/*.zip)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Android Studio plugin ${GITHUB_REF_NAME#android-studio-v}" \
                 --notes "Flutter DB Inspector for Android Studio / IntelliJ. Install from Settings > Plugins > Marketplace, or install this zip from disk. https://plugins.jetbrains.com/plugin/34899-flutter-db-inspector"
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
