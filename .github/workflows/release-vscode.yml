name: Release VS Code extension

# Push a tag like `vscode-v1.0.0` (it must match package.json "version"),
# or run manually from the Actions tab.
#
# Repository secrets:
#   VSCE_PAT  Azure DevOps personal access token, scope "Marketplace > Manage",
#             organization "All accessible organizations".
#   OVSX_PAT  Open VSX access token (optional; Open VSX is skipped without it).
on:
  push:
    tags: ['vscode-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the Marketplace and Open VSX (otherwise only build the .vsix)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-vscode
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/vscode/flutter-db-inspector
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/vscode/flutter-db-inspector/package-lock.json

      - name: Check tag matches package.json version
        if: github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "vscode-v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION} (expected vscode-v${VERSION})"
            exit 1
          fi

      - name: Install shared web UI dependencies
        working-directory: shared/web-ui
        run: npm ci
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

      - name: Package
        run: |
          npx vsce package --no-dependencies
          echo "VSIX=$(ls *.vsix)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-db-inspector-vsix
          path: integrations/vscode/flutter-db-inspector/*.vsix

      - name: Publish to Visual Studio Marketplace
        if: env.PUBLISH == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies --packagePath "$VSIX"

      - name: Publish to Open VSX
        if: env.PUBLISH == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT not set; skipping Open VSX."
            exit 0
          fi
          npx --yes ovsx@0.10.6 publish "$VSIX" -p "$OVSX_PAT"

      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "VS Code extension ${GITHUB_REF_NAME#vscode-v}" --notes-file CHANGELOG.md
          gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
