name: sqlite_example
description: >-
  Flutter DB Inspector example: a running app with SQLite (sqflite), Hive and
  SharedPreferences data you can inspect from DevTools, VS Code or Android
  Studio.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_db_inspector: ^1.0.0
  hive_ce: ^2.11.0
  path: ^1.9.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.0
  sqflite: ^2.4.0

# Local development resolves Flutter DB Inspector from this repository
# through pubspec_overrides.yaml.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
